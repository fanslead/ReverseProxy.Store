services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: reverseproxy_store
      POSTGRES_USER: reverseproxy
      POSTGRES_PASSWORD: reverseproxy_dev
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reverseproxy -d reverseproxy_store"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - reverseproxy-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "63799:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - reverseproxy-redis:/data

volumes:
  reverseproxy-postgres:
  reverseproxy-redis: